<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f9f9f9; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: white; max-width: 500px; }
        .admin-badge { background: black; color: gold; padding: 3px 8px; border-radius: 3px; font-weight: bold; }
        .admin-section { margin-top: 20px; padding: 15px; border: 2px solid #d9534f; background: #fff5f5; border-radius: 8px; }
        .admin-btn { background: #d9534f; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    <div class="card">
        <p>Role: {% if role == 'admin' %}<span class="admin-badge">ADMIN</span>{% else %}USER{% endif %}</p>
        <hr>
        {% if role == 'admin' %}
        <div class="admin-section">
        <h3 style="margin-top: 0; color: #d9534f;">⚠️ System Management</h3>
        <p style="font-size: 0.85rem; color: #666;">서버의 현재 설정 상태와 환경 변수를 모니터링합니다.</p>
        <a href="/admin/system" class="admin-btn">환경 변수 로그 확인</a>
        </div>
        {% endif %}
        <p><a href="/logout">Logout</a></p>
    </div>
</body>
</html>
