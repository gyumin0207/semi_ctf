<!DOCTYPE html>
<html>
<head><title>System Inspector</title></head>
<body>
    <h1>💻 System Environment Variables</h1>
    <p>아래 목록에서 <strong>FLAG</strong> 항목을 찾아보세요!</p>
    <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr style="background: #eee;"><th>Key</th><th>Value</th></tr>
        {% for k, v in env_vars.items() %}
        <tr><td>{{ k }}</td><td>{{ v }}</td></tr>
        {% endfor %}
    </table>
    <br><a href="/dashboard">뒤로가기</a>
</body>
</html>
